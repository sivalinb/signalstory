receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  attributes/redact:
    actions:
    - key: user.email
      action: delete
  batch:
    timeout: 1s
exporters:
  debug:
    verbosity: detailed
service:
  pipelines:
    traces:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - attributes/redact
      - batch
      exporters:
      - debug
    metrics:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - attributes/redact
      - batch
      exporters:
      - debug
    logs:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - attributes/redact
      - batch
      exporters:
      - debug
