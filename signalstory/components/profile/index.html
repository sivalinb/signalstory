<!doctype html><html><head><meta charset="utf-8"></head><body><script>
'use strict';const post=(type,extra={})=>parent.postMessage({isStreamlitMessage:true,type,...extra},'*');let sent=null;window.addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='streamlit:render')return;const a=e.data.args;let token=a.token;try{const saved=localStorage.getItem('signalstory-profile-v1');if(saved&&!a.reset)token=saved;else localStorage.setItem('signalstory-profile-v1',a.token);}catch{}if(sent!==token){sent=token;post('streamlit:setComponentValue',{value:token,dataType:'json'});}post('streamlit:setFrameHeight',{height:0});});post('streamlit:componentReady',{apiVersion:1});
</script></body></html>
