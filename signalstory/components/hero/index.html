<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;color:#e9f7f4;font:13px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.world{border-radius:24px;border:1px solid #284c53;padding:25px;background:radial-gradient(ellipse at 90% 0,#1d5152,transparent 65%),#102631;overflow:hidden;min-height:365px}.top{display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:650;letter-spacing:1.4px;color:#92d3bf}.pill{border:1px solid #396663;border-radius:20px;padding:4px 9px;letter-spacing:.6px}.journey{position:relative;margin:22px 0 24px;display:flex;justify-content:space-between;align-items:center;gap:13px}.node{background:#173a43;border:1px solid #39616a;border-radius:16px;padding:17px 10px;text-align:center;min-width:90px;flex:1;transition:border-color .3s,box-shadow .3s}.node.active{border-color:#80f0ce;box-shadow:0 0 25px #66e7bd25}.node svg{width:34px;height:34px;display:block;margin:0 auto 8px;stroke:#80f0ce;fill:none;stroke-width:1.5}.node strong{font-size:13px;font-weight:550}.wire{width:22px;height:2px;background:#426672;position:relative}.wire:after{content:'›';position:absolute;right:-1px;top:-14px;color:#6a8c98;font-size:19px}.metrics{display:grid;grid-template-columns:1fr 1fr 1.45fr;gap:10px}.metric{padding:13px;border:1px solid #355260;border-radius:12px;background:#0d202be0}.metric p{margin:0;color:#a7bfcb;font-size:10px;letter-spacing:.3px}.metric strong{font:650 30px/1.5 ui-monospace,SFMono-Regular,monospace;color:#80f0ce}.metric small{display:block;font-size:10px;color:#a1bcc7}.bars{height:44px;display:flex;align-items:flex-end;gap:8px;margin:9px 0 3px}.bar-group{flex:1;text-align:center}.bar{background:linear-gradient(#80f0ce,#34756d);height:3px;border-radius:3px 3px 0 0;transition:height .45s}.bar-group span{font-size:9px;color:#a5c4d1}.bar-group b{font:500 10px ui-monospace;display:block;margin-bottom:2px;color:#80f0ce}.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px}.bottom button{border:0;border-radius:10px;background:#80f0ce;color:#123333;font-family:inherit;font-size:12px;font-weight:650;line-height:1.5;padding:10px 14px;cursor:pointer}.bottom button:disabled{opacity:.5}.bottom select{border:1px solid #40636b;background:#153540;color:#d7eeea;padding:9px 7px;border-radius:9px;font-size:11px}.hint{margin:12px 0 0;color:#a8c4ce;font-size:11px;min-height:34px}.restart{font-size:10px;color:#a4c5d0;background:none;border:0;text-decoration:underline;cursor:pointer}.bottom button:focus-visible,select:focus-visible{outline:3px solid #f4ca77;outline-offset:3px}@media(max-width:380px){.world{padding:16px}.journey{gap:5px}.node{min-width:60px;padding:13px 5px}.wire{width:10px}.bottom{flex-wrap:wrap}.metric{padding:8px}.metric strong{font-size:24px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><section class="world" aria-label="A checkout request becomes three measurements"><div class="top"><span>THE CHECKOUT STORY</span><span class="pill">YOU CONTROL THE REQUEST</span></div>
<div class="journey"><div class="node" id="checkout"><svg viewBox="0 0 40 40" aria-hidden="true"><rect x="6" y="9" width="28" height="22" rx="4"/><path d="M6 16h28M14 24h12"/></svg><strong>Checkout</strong></div><div class="wire"></div><div class="node" id="payment"><svg viewBox="0 0 40 40" aria-hidden="true"><rect x="5" y="11" width="30" height="20" rx="4"/><path d="M5 17h30M11 25h8"/></svg><strong>Payment</strong></div><div class="wire"></div><div class="node" id="database"><svg viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="20" cy="10" rx="13" ry="5"/><path d="M7 10v20c0 7 26 7 26 0V10M7 20c0 7 26 7 26 0"/></svg><strong>Database</strong></div></div>
<div class="metrics"><div class="metric"><p>COUNTER</p><strong id="total">0</strong><small>requests finished so far</small></div><div class="metric"><p>GAUGE</p><strong id="waiting">0</strong><small>requests in flight now</small></div><div class="metric"><p>CUMULATIVE BUCKETS</p><div class="bars" id="bars"></div><small id="hist-sum">0 observations · 0s total</small></div></div>
<div class="bottom"><button id="send">Send a request ↗</button><label><span style="position:absolute;clip:rect(0,0,0,0)">Teaching duration</span><select id="duration"><option value="0.42">0.42 seconds</option><option value="0.08">0.08 seconds</option><option value="0.8">0.80 seconds</option><option value="1.4">1.40 seconds</option></select></label><button class="restart" id="restart" style="background:none;color:#a4c5d0;padding:0">Restart demo</button></div><p id="hint" class="hint" aria-live="polite">Send one request. Watch a total, a current state, and a distribution tell different parts of the same story.</p></section>
<script src="hero.js"></script></body></html>
