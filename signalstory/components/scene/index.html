<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="lesson.css"><style>.stage{padding:22px 25px 8px;overflow-x:auto}svg{display:block;width:100%;min-width:680px;height:auto}.evidence{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 25px 20px}.evidence div{border:1px solid #355360;border-radius:12px;padding:12px 15px;background:#10232f}.evidence small{color:#9db8c7;font-size:10px;letter-spacing:.7px;display:block}.evidence strong{overflow-wrap:anywhere;font-size:13px;font-weight:550;display:block;margin-top:5px;color:#dbeae9}.explain{font-size:11px;color:#9cb8c5;margin:0 26px 18px}.packet{filter:drop-shadow(0 0 8px #80f0ce60)}@media(max-width:500px){.stage{padding-left:10px;padding-right:10px}.stage:before{content:'Swipe to explore the complete diagram →';display:block;color:#acc7ce;font-size:11px;margin:0 8px 12px}.evidence{grid-template-columns:1fr;margin:8px 12px 16px}.evidence div{padding:8px 12px}.explain{margin:0 16px 15px}}</style></head><body>
<section class="shell" aria-label="Interactive request journey studio"><header class="top"><div><p class="kicker">THE REQUEST STUDIO</p><h2 id="title">Loading the request journey…</h2></div><span class="tag" id="scene-label">FOLLOW THE EVIDENCE</span></header>
<div class="stage"><svg id="scene" viewBox="0 0 860 250" role="img" aria-label="Illustrated telemetry concept"></svg></div><div class="evidence" id="evidence"></div><p class="explain" id="scope"></p>
<div class="controls"><button id="play">▶ Play story</button><button id="back" aria-label="Previous animation step">←</button><button id="next" aria-label="Next animation step">→</button><input id="step" type="range" min="0" max="3" value="0" aria-label="Animation step"><select id="speed" aria-label="Animation speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></div>
<div class="narration" aria-live="polite"><span class="counter" id="counter">MOMENT 1 OF 4</span><h3 id="step-title">Start with the request</h3><p id="narration"></p></div><footer>Illustrated state · The experiment runs the real OpenTelemetry Python SDK</footer></section><script src="scene.js"></script></body></html>
