name: Verify learning evidence
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  learning:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: python -m scripts.engine_setup
      - run: pytest -q
      - run: node --test tests/animation_math.test.js
      - run: ruff check .
      - run: python -m scripts.build_preview
      - run: git diff --exit-code -- docs/playground
