[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "signalstory"
version = "1.0.0"
description = "Visual observability learning: PromQL, SQL comparisons, OpenTelemetry, practical evidence, and spaced review."
requires-python = ">=3.11,<3.14"
[tool.setuptools.packages.find]
include = ["signalstory*", "scripts*"]
[tool.setuptools.package-data]
signalstory = ["components/**/*", "style.css"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
